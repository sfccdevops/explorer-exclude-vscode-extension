name: Package Extension Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        run: |
          package_version=$(node -p "require('./package.json').version")
          lockfile_version=$(node -p "require('./package-lock.json').version")
          tag_version="${GITHUB_REF_NAME#v}"
          test "$package_version" = "$tag_version"
          test "$lockfile_version" = "$tag_version"

      - name: Package VSIX
        run: npm run package

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: Explorer Exclude Manager ${{ github.ref_name }}
          body: See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md)
          files: "*.vsix"
